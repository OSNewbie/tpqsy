<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纯算法去水印 · 元数据清除 · 本地验证</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header span{font-size:12px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=file],input[type=text]{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;flex:1;min-width:180px}
input[type=file]{color:var(--muted)}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
button.ghost.active{border-color:var(--accent);color:var(--accent)}
#canvasWrap{position:relative;display:inline-block;max-width:100%;margin-top:8px;border-radius:6px;overflow:hidden;background:#000;min-height:100px}
#canvas{display:block;max-width:100%;height:auto;cursor:crosshair;touch-action:none}
#canvasWrap.empty::after{content:"加载图片后在此标记";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.toolbar button{padding:6px 10px;font-size:12px}
.status{font-size:12.5px;color:var(--muted);min-height:18px;margin-top:6px}.status.ok{color:var(--ok)}.status.err{color:var(--bad)}
.report-item{display:grid;grid-template-columns:160px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.report-key{color:var(--muted)}
.badge{padding:1px 8px;border-radius:12px;font-size:11px;font-weight:600;margin-right:6px}
.b-removed{background:rgba(63,185,80,.15);color:var(--ok)}
.b-present{background:rgba(248,81,73,.15);color:var(--bad)}
.b-empty{background:rgba(139,148,158,.12);color:var(--muted)}
@media(max-width:600px){.report-item{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<header><h1>纯算法去水印 · 元数据清除 · 本地验证</h1><span id="boot">初始化…</span></header>
<main>

<section class="card">
<h2>1. 加载图片</h2>
<div class="row"><input type="file" id="fileInput" accept="image/*"></div>
<div class="row" style="margin-top:8px">
<input type="text" id="urlInput" placeholder="或图片 URL（需 CORS）">
<button id="urlBtn">加载 URL</button>
</div>
<div class="status" id="loadStatus"></div>
</section>

<section class="card">
<h2>2. 标记与修复（全传统算法，无模型）</h2>
<div class="toolbar">
<button id="modeBrush" class="ghost active" disabled>🖌️ 画笔</button>
<button id="modeClone" class="ghost" disabled>📋 仿制图章</button>
<button id="modeBlur" class="ghost" disabled>💧 模糊</button>
<button id="clearMask" class="ghost" disabled>清空标记</button>
<button id="undoBtn" class="ghost" disabled>撤销</button>
</div>
<div class="row" style="margin-top:8px;font-size:12px;color:var(--muted)">
笔刷 <input type="range" id="brushSize" min="4" max="80" value="20" disabled> <span id="brushVal">20</span> px
</div>
<div id="canvasWrap" class="empty"><canvas id="canvas"></canvas></div>
<div class="row" style="margin-top:10px">
<button id="teleaBtn" disabled>Telea 快速修复</button>
<button id="patchBtn" class="ghost" disabled>PatchMatch + 低频重整</button>
<button id="diffuseBtn" class="ghost" disabled>调和扩散（渐变/纯色）</button>
<button id="alphaBtn" class="ghost" disabled>反向 Alpha（已知水印样式）</button>
</div>
<div class="status" id="inpaintStatus"></div>
<div class="hint" style="font-size:12px;color:var(--muted);margin-top:8px;padding:8px 10px;border-left:2px solid var(--border)">
修复效果取决于背景复杂度：<strong>Telea</strong> 适合简单/渐变背景；<strong>PatchMatch+低频</strong> 适合有重复纹理的背景（天空、草地、木纹、墙面）；<strong>调和扩散</strong> 对纯色/渐变最自然；<strong>反向 Alpha</strong> 需要已知水印的透明度 α；<strong>仿制图章</strong> 是复杂纹理（人脸、花纹）的手动兜底。
</div>
</section>

<section class="card">
<h2>3. 元数据清除与验证</h2>
<div class="row">
<button id="stripBtn" disabled>清除元数据并导出 PNG</button>
<button id="verifyBtn" class="ghost" disabled>重新检测导出文件</button>
</div>
<div class="status" id="stripStatus"></div>
<div id="report"></div>
<div class="row" style="margin-top:10px" id="dlRow" hidden>
<a id="dlLink" download><button>下载处理后的 PNG</button></a>
</div>
</section>

</main>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const boot=$('#boot');
window.onerror=(m)=>{boot.textContent='错误：'+m;boot.style.color='#f85149'};

/* ---------- 动态加载 EXIF 解析器（仅用于验证，失败不影响修复） ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('加载失败:'+src));document.head.appendChild(s)})}
let exifReady=null;
function ensureExif(){
  if(window.ExifReader)return Promise.resolve(window.ExifReader);
  if(!exifReady)exifReady=loadScript('https://cdn.jsdelivr.net/npm/exifreader@5.0.0/dist/exif-reader.min.js').then(()=>{boot.textContent='EXIF 验证器已就绪';return window.ExifReader});
  return exifReady;
}

/* ---------- 状态 ---------- */
const st={file:null,img:null,W:0,H:0,maskCtx:null,history:[],drawing:false,mode:'brush',brush:20,
  cloneSrc:null,processedFile:null,outUrl:null,origExif:null,verifyExif:null,tainted:false};

const canvas=$('#canvas'),wrap=$('#canvasWrap'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const fileInput=$('#fileInput'),urlInput=$('#urlInput'),urlBtn=$('#urlBtn');
const modeBrush=$('#modeBrush'),modeClone=$('#modeClone'),modeBlur=$('#modeBlur');
const clearMaskBtn=$('#clearMask'),undoBtn=$('#undoBtn');
const brushSize=$('#brushSize'),brushVal=$('#brushVal');
const teleaBtn=$('#teleaBtn'),patchBtn=$('#patchBtn'),diffuseBtn=$('#diffuseBtn'),alphaBtn=$('#alphaBtn');
const stripBtn=$('#stripBtn'),verifyBtn=$('#verifyBtn');
const loadStatus=$('#loadStatus'),inpaintStatus=$('#inpaintStatus'),stripStatus=$('#stripStatus');
const reportEl=$('#report'),dlRow=$('#dlRow'),dlLink=$('#dlLink');

const setStatus=(el,t,c='')=>{el.textContent=t;el.className='status '+c};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 图片加载 ---------- */
fileInput.onchange=e=>{const f=e.target.files[0];if(f)loadFile(f)};
urlBtn.onclick=()=>{const u=urlInput.value.trim();if(u)loadUrl(u)};

async function loadFile(file){
  resetAll();st.file=file;setStatus(loadStatus,'解码中…');
  try{
    let bmp;try{bmp=await createImageBitmap(file)}catch{bmp=await loadImg(URL.createObjectURL(file),false)}
    await setup(bmp,file.size);await readExif(file);
  }catch(e){setStatus(loadStatus,'失败：'+e.message,'err')}
}

async function loadUrl(url){
  resetAll();setStatus(loadStatus,'通过 URL 加载（CORS）…');
  try{
    let blob;
    try{const r=await fetch(url,{mode:'cors'});if(!r.ok)throw 0;blob=await r.blob()}
    catch{
      const img=await loadImg(url,true);const c=document.createElement('canvas');
      c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
      blob=await new Promise(res=>c.toBlob(res,'image/png'));
      if(!blob)throw new Error('CORS 拒绝');
    }
    if(!blob.type.startsWith('image/'))throw new Error('非图片');
    const f=new File([blob],(url.split('/').pop()||'remote').split('?')[0],{type:blob.type});
    st.file=f;let bmp;try{bmp=await createImageBitmap(blob)}catch{bmp=await loadImg(URL.createObjectURL(blob),false)}
    await setup(bmp,f.size);await readExif(f);
    setStatus(loadStatus,`${st.W}×${st.H} · ${(f.size/1024).toFixed(0)}KB`,'ok');
  }catch(e){setStatus(loadStatus,'URL 失败：'+e.message+'（目标服务器需允许 CORS）','err')}
}

function loadImg(src,cors){
  return new Promise((res,rej)=>{
    const im=new Image();if(cors)im.crossOrigin='anonymous';
    im.onload=()=>res(im);im.onerror=()=>rej(new Error('图片加载失败'));
    im.src=src;
  });
}

async function setup(bmp,size){
  st.img=bmp;st.W=bmp.width||bmp.naturalWidth;st.H=bmp.height||bmp.naturalHeight;
  canvas.width=st.W;canvas.height=st.H;ctx.clearRect(0,0,st.W,st.H);ctx.drawImage(bmp,0,0);
  wrap.classList.remove('empty');

  st.tainted=false;try{ctx.getImageData(0,0,1,1)}catch{st.tainted=true}

  const mc=document.createElement('canvas');mc.width=st.W;mc.height=st.H;
  st.maskCtx=mc.getContext('2d',{willReadFrequently:true});
  st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,st.W,st.H);

  [modeBrush,modeClone,modeBlur,clearMaskBtn,brushSize,teleaBtn,patchBtn,diffuseBtn,alphaBtn,stripBtn].forEach(el=>el.disabled=false);
  if(st.tainted)setStatus(loadStatus,'Canvas 被跨域污染，无法读取/导出像素','err');
}

function resetAll(){
  if(st.outUrl)URL.revokeObjectURL(st.outUrl);
  Object.assign(st,{file:null,img:null,W:0,H:0,maskCtx:null,history:[],drawing:false,cloneSrc:null,processedFile:null,outUrl:null,origExif:null,verifyExif:null,tainted:false});
  ctx.clearRect(0,0,canvas.width,canvas.height);canvas.width=0;canvas.height=0;
  wrap.classList.add('empty');dlRow.hidden=true;
  [modeBrush,modeClone,modeBlur,clearMaskBtn,brushSize,teleaBtn,patchBtn,diffuseBtn,alphaBtn,stripBtn,verifyBtn,undoBtn].forEach(el=>el.disabled=true);
  reportEl.innerHTML='';setStatus(loadStatus,'');setStatus(inpaintStatus,'');setStatus(stripStatus,'');
}

/* ---------- 元数据 ---------- */
const SENSITIVE=['Make','Model','Software','DateTimeOriginal','CreateDate','ModifyDate','GPSLatitude','GPSLongitude','GPSAltitude','LensModel','SerialNumber','Artist','Copyright'];
async function readExif(file){
  try{const ER=await ensureExif();const tags=await ER.load(file);st.origExif=extract(tags);render('orig')}
  catch{reportEl.innerHTML='<div style="color:#d29922;font-size:12.5px;padding:8px 0">EXIF 验证器不可用；导出 PNG 仍会剥离元数据。</div>'}
}
function extract(tags){
  if(!tags)return{};const o={};for(const k of SENSITIVE)if(tags[k]!=null&&tags[k]!=='')o[k]=tags[k];
  if(tags.latitude!=null&&tags.longitude!=null)o['GPS 坐标']=tags.latitude+', '+tags.longitude;return o;
}

/* ---------- 画笔 / 仿制图章 / 模糊 ---------- */
function setMode(m){st.mode=m;modeBrush.classList.toggle('active',m==='brush');modeClone.classList.toggle('active',m==='clone');modeBlur.classList.toggle('active',m==='blur')}
modeBrush.onclick=()=>setMode('brush');
modeClone.onclick=()=>{setMode('clone');setStatus(inpaintStatus,'按住 Alt 点击取样，然后涂抹覆盖')};
modeBlur.onclick=()=>setMode('blur');
brushSize.oninput=()=>{st.brush=+brushSize.value;brushVal.textContent=brushSize.value};
clearMaskBtn.onclick=()=>{st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,st.W,st.H);st.history.push({type:'clear'});undoBtn.disabled=false;redraw()};

canvas.addEventListener('pointerdown',e=>{
  if(!st.maskCtx)return;
  if(st.mode==='clone'&&e.altKey){const p=pt(e);st.cloneSrc=p;setStatus(inpaintStatus,'已取样 ('+Math.round(p.x)+','+Math.round(p.y)+')');return}
  st.drawing=true;canvas.setPointerCapture(e.pointerId);paint(e);
});
canvas.addEventListener('pointermove',e=>{if(st.drawing)paint(e)});
canvas.addEventListener('pointerup',()=>st.drawing=false);
canvas.addEventListener('pointercancel',()=>st.drawing=false);

function pt(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(st.W/r.width),y:(e.clientY-r.top)*(st.H/r.height)}}

function paint(e){
  const p=pt(e);
  if(st.mode==='clone'&&st.cloneSrc){
    const sx=Math.round(st.cloneSrc.x-st.brush/2),sy=Math.round(st.cloneSrc.y-st.brush/2);
    const data=ctx.getImageData(sx,sy,st.brush,st.brush);
    ctx.putImageData(data,Math.round(p.x-st.brush/2),Math.round(p.y-st.brush/2));
    return;
  }
  st.history.push({x:p.x,y:p.y,size:st.brush,mode:st.mode,cloneSrc:st.cloneSrc});undoBtn.disabled=false;
  if(st.mode==='blur'){
    const x=Math.round(p.x-st.brush/2),y=Math.round(p.y-st.brush/2);
    const img=ctx.getImageData(x,y,st.brush,st.brush);boxBlur(img,2);ctx.putImageData(img,x,y);return;
  }
  st.maskCtx.fillStyle='#fff';st.maskCtx.beginPath();st.maskCtx.arc(p.x,p.y,st.brush/2,0,Math.PI*2);st.maskCtx.fill();redraw();
}

function boxBlur(imgData,r){
  const{data,width:w,height:h}=imgData;const tmp=new Uint8ClampedArray(data);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let rr=0,gg=0,bb=0,n=0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const sx=x+dx,sy=y+dy;if(sx<0||sy<0||sx>=w||sy>=h)continue;
      const i=(sy*w+sx)*4;rr+=tmp[i];gg+=tmp[i+1];bb+=tmp[i+2];n++;
    }
    const o=(y*w+x)*4;data[o]=rr/n;data[o+1]=gg/n;data[o+2]=bb/n;
  }
}

function redraw(){
  ctx.clearRect(0,0,st.W,st.H);if(st.img)ctx.drawImage(st.img,0,0);
  if(!st.maskCtx)return;
  const md=st.maskCtx.getImageData(0,0,st.W,st.H).data;
  const ov=ctx.getImageData(0,0,st.W,st.H);const od=ov.data;
  for(let i=0;i<md.length;i+=4)if(md[i]>128){od[i]=255;od[i+1]=60;od[i+2]=60;od[i+3]=Math.max(od[i+3],100)}
  ctx.putImageData(ov,0,0);
}

undoBtn.onclick=()=>{
  const l=st.history.pop();if(!l)return;
  if(l.type==='clear'){st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,st.W,st.H)}
  else if(l.mode==='clone'){setStatus(inpaintStatus,'仿制图章无法精确撤销，建议重新取样')}
  else{st.maskCtx.fillStyle='#000';st.maskCtx.beginPath();st.maskCtx.arc(l.x,l.y,l.size/2,0,Math.PI*2);st.maskCtx.fill()}
  redraw();undoBtn.disabled=st.history.length===0;
};

/* ================================================================
   传统修复算法 1：Telea 快速行进
   ================================================================ */
teleaBtn.onclick=async()=>{
  if(st.tainted)return setStatus(inpaintStatus,'Canvas 污染','err');
  teleaBtn.disabled=true;setStatus(inpaintStatus,'Telea 修复中…');
  try{
    const w=st.W,h=st.H;const img=ctx.getImageData(0,0,w,h);const mask=st.maskCtx.getImageData(0,0,w,h).data;
    const msk=new Uint8Array(w*h);let marked=0;
    for(let i=0;i<mask.length;i+=4)if(mask[i]>128){msk[i/4]=1;marked++}
    if(marked===0)throw new Error('请先标记区域');
    teleaInpaint(img.data,msk,w,h);
    ctx.putImageData(img,0,0);st.img=await createImageBitmap(canvas);
    st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,w,h);st.history=[];
    setStatus(inpaintStatus,`Telea 完成（${marked} px）`,'ok');
  }catch(e){setStatus(inpaintStatus,'Telea 失败：'+e.message,'err')}
  finally{teleaBtn.disabled=false}
};

/* Telea 算法核心：快速行进 + 边界加权插值 */
function teleaInpaint(data,msk,w,h){
  // 距离场：0=已知，Infinity=未知
  const dist=new Float32Array(w*h);
  const heap=[];
  for(let i=0;i<w*h;i++){
    if(msk[i]){dist[i]=1e9}
    else{dist[i]=0;heap.push(i)}
  }
  // 简化实现：从边界向内逐层推进
  let changed=true;
  while(changed){
    changed=false;
    const next=[];
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const i=y*w+x;if(dist[i]<1e9)continue;
      // 检查是否邻接已知像素
      let known=0,sumR=0,sumG=0,sumB=0,cnt=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const ni=(y+dy)*w+(x+dx);
        if(dist[ni]<1e8){known=1;const j=ni*4;sumR+=data[j];sumG+=data[j+1];sumB+=data[j+2];cnt++}
      }
      if(known&&cnt>0){
        const j=i*4;data[j]=sumR/cnt;data[j+1]=sumG/cnt;data[j+2]=sumB/cnt;
        dist[i]=1;next.push(i);changed=true;
      }
    }
  }
}

/* ================================================================
   传统修复算法 2：PatchMatch + 低频拉普拉斯重整
   ================================================================ */
patchBtn.onclick=async()=>{
  if(st.tainted)return setStatus(inpaintStatus,'Canvas 污染','err');
  patchBtn.disabled=true;setStatus(inpaintStatus,'PatchMatch + 低频重整中…');
  try{
    const w=st.W,h=st.H;const img=ctx.getImageData(0,0,w,h);const mask=st.maskCtx.getImageData(0,0,w,h).data;
    const msk=new Uint8Array(w*h);let marked=0;
    for(let i=0;i<mask.length;i+=4)if(mask[i]>128){msk[i/4]=1;marked++}
    if(marked===0)throw new Error('请先标记区域');
    await patchMatchInpaint(img.data,msk,w,h);
    ctx.putImageData(img,0,0);st.img=await createImageBitmap(canvas);
    st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,w,h);st.history=[];
    setStatus(inpaintStatus,`PatchMatch 完成（${marked} px）`,'ok');
  }catch(e){setStatus(inpaintStatus,'PatchMatch 失败：'+e.message,'err')}
  finally{patchBtn.disabled=false}
};

async function patchMatchInpaint(data,msk,w,h){
  // 步骤 1：对标记区域做 PatchMatch 高频纹理填充（简化版：随机搜索 + 投票）
  const out=new Uint8ClampedArray(data);
  const patch=4;
  const markedPixels=[];
  for(let i=0;i<w*h;i++)if(msk[i])markedPixels.push(i);
  // 简化 PatchMatch：对每个标记像素，在已知区域随机搜索相似 patch
  for(let i=0;i<markedPixels.length;i++){
    const pi=markedPixels[i];const px=pi%w,py=(pi/w)|0;
    let best=null,bestDist=Infinity;
    for(let attempt=0;attempt<24;attempt++){
      const sx=Math.floor(Math.random()*w),sy=Math.floor(Math.random()*h);
      if(msk[sy*w+sx])continue;
      let d=0,valid=0;
      for(let dy=-patch;dy<=patch;dy++)for(let dx=-patch;dx<=patch;dx++){
        const x1=px+dx,y1=py+dy,x2=sx+dx,y2=sy+dy;
        if(x1<0||y1<0||x1>=w||y1>=h)continue;
        const idx1=(y1*w+x1)*4,idx2=(y2*w+x2)*4;
        d+=Math.abs(data[idx1]-data[idx2])+Math.abs(data[idx1+1]-data[idx2+1])+Math.abs(data[idx1+2]-data[idx2+2]);
        valid++;
      }
      if(valid>0&&d/valid<bestDist){bestDist=d/valid;best=idx2}
    }
    if(best!=null){out[pi*4]=data[best];out[pi*4+1]=data[best+1];out[pi*4+2]=data[best+2]}
    if(i%400===0)await sleep(0);
  }
  // 步骤 2：低频重整——在 24×24 粗网格上解拉普拉斯方程
  const grid=24;
  const lowRes=downsample(out,w,h,grid);
  solveLaplacian(lowRes,msk,w,h,grid);
  upsampleLowFreq(out,lowRes,w,h,grid,msk);
  // 混合高频（PatchMatch）和低频（拉普拉斯）
  for(let i=0;i<w*h;i++){
    if(!msk[i])continue;
    const j=i*4;
    data[j]=clamp(out[j]*0.65+data[j]*0.35);
    data[j+1]=clamp(out[j+1]*0.65+data[j+1]*0.35);
    data[j+2]=clamp(out[j+2]*0.65+data[j+2]*0.35);
  }
}

function downsample(data,w,h,grid){
  const cellW=Math.ceil(w/grid),cellH=Math.ceil(h/grid);
  const g=new Float32Array(grid*grid*3);
  for(let gy=0;gy<grid;gy++)for(let gx=0;gx<grid;gx++){
    let r=0,gg=0,b=0,n=0;
    for(let y=gy*cellH;y<Math.min(h,(gy+1)*cellH);y++)for(let x=gx*cellW;x<Math.min(w,(gx+1)*cellW);x++){
      const i=(y*w+x)*4;r+=data[i];gg+=data[i+1];b+=data[i+2];n++;
    }
    const o=(gy*grid+gx)*3;if(n){g[o]=r/n;g[o+1]=gg/n;g[o+2]=b/n}
  }
  return g;
}

function solveLaplacian(g,msk,w,h,grid){
  // 对网格中标记的单元，用周围已知单元的平均值迭代填充
  for(let iter=0;iter<200;iter++){
    let changed=false;
    for(let gy=1;gy<grid-1;gy++)for(let gx=1;gx<grid-1;gx++){
      const o=(gy*grid+gx)*3;
      // 检查该网格单元是否包含标记像素
      let hasMask=false;
      const cellW=Math.ceil(w/grid),cellH=Math.ceil(h/grid);
      for(let y=gy*cellH;y<Math.min(h,(gy+1)*cellH)&&!hasMask;y++)for(let x=gx*cellW;x<Math.min(w,(gx+1)*cellW);x++){
        if(msk[y*w+x]){hasMask=true;break}
      }
      if(!hasMask)continue;
      // 拉普拉斯：与四邻域平均值趋同
      const up=(gy-1)*grid*3+gx*3,down=(gy+1)*grid*3+gx*3,left=gy*grid*3+(gx-1)*3,right=gy*grid*3+(gx+1)*3;
      const nr=(g[up]+g[down]+g[left]+g[right])/4;
      const ng=(g[up+1]+g[down+1]+g[left+1]+g[right+1])/4;
      const nb=(g[up+2]+g[down+2]+g[left+2]+g[right+2])/4;
      if(Math.abs(g[o]-nr)>0.5){g[o]=nr;g[o+1]=ng;g[o+2]=nb;changed=true}
    }
    if(!changed)break;
  }
}

function upsampleLowFreq(data,g,w,h,grid,msk){
  const cellW=w/grid,cellH=h/grid;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;if(!msk[i])continue;
    const gx=Math.min(grid-1,Math.floor(x/cellW)),gy=Math.min(grid-1,Math.floor(y/cellH));
    const o=(gy*grid+gx)*3;const j=i*4;
    data[j]=g[o];data[j+1]=g[o+1];data[j+2]=g[o+2];
  }
}
function clamp(v){return v<0?0:v>255?255:v}

/* ================================================================
   传统修复算法 3：调和扩散（边界颜色向内传播 + 平滑）
   ================================================================ */
diffuseBtn.onclick=async()=>{
  if(st.tainted)return setStatus(inpaintStatus,'Canvas 污染','err');
  diffuseBtn.disabled=true;setStatus(inpaintStatus,'调和扩散修复中…');
  try{
    const w=st.W,h=st.H;const img=ctx.getImageData(0,0,w,h);const mask=st.maskCtx.getImageData(0,0,w,h).data;
    const msk=new Uint8Array(w*h);let marked=0;
    for(let i=0;i<mask.length;i+=4)if(mask[i]>128){msk[i/4]=1;marked++}
    if(marked===0)throw new Error('请先标记区域');
    harmonicDiffuse(img.data,msk,w,h);
    ctx.putImageData(img,0,0);st.img=await createImageBitmap(canvas);
    st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,w,h);st.history=[];
    setStatus(inpaintStatus,`调和扩散完成（${marked} px）`,'ok');
  }catch(e){setStatus(inpaintStatus,'扩散失败：'+e.message,'err')}
  finally{diffuseBtn.disabled=false}
};

function harmonicDiffuse(data,msk,w,h){
  // 多轮迭代：标记像素取四邻域平均值
  for(let iter=0;iter<800;iter++){
    let changed=false;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const i=y*w+x;if(!msk[i])continue;
      const j=i*4;
      const n=[(y-1)*w+x,y*w+x-1,y*w+x+1,(y+1)*w+x];
      let r=0,g=0,b=0,nn=0;
      for(const ni of n){if(!msk[ni]){const k=ni*4;r+=data[k];g+=data[k+1];b+=data[k+2];nn++}}
      if(nn>0){
        const nr=r/nn,ng=g/nn,nb=b/nn;
        if(Math.abs(data[j]-nr)>0.3){data[j]=nr;data[j+1]=ng;data[j+2]=nb;changed=true}
      }
    }
    if(!changed)break;
  }
}

/* ================================================================
   传统修复算法 4：反向 Alpha 混合（已知水印样式）
   ================================================================ */
alphaBtn.onclick=async()=>{
  if(st.tainted)return setStatus(inpaintStatus,'Canvas 污染','err');
  alphaBtn.disabled=true;
  try{
    const w=st.W,h=st.H;const sd=ctx.getImageData(0,0,w,h);const mask=st.maskCtx.getImageData(0,0,w,h).data;
    let marked=0;for(let i=0;i<mask.length;i+=4)if(mask[i]>128)marked++;
    if(marked===0)throw new Error('请先标记水印区域');
    const alpha=prompt('请输入水印的近似透明度 α（0–1，例如 Gemini 水印约 0.45）：','0.45');
    if(alpha===null)return;
    const a=parseFloat(alpha);if(isNaN(a)||a<0||a>1)throw new Error('α 必须在 0–1 之间');
    const overlay=255; // 假设水印为白色/浅色
    reverseAlphaUnblend(sd.data,mask,w,h,a,overlay);
    ctx.putImageData(sd,0,0);st.img=await createImageBitmap(canvas);
    st.maskCtx.fillStyle='#000';st.maskCtx.fillRect(0,0,w,h);st.history=[];
    setStatus(inpaintStatus,`反向 Alpha 完成（α=${a}，${marked} px）`,'ok');
  }catch(e){setStatus(inpaintStatus,'反向 Alpha 失败：'+e.message,'err')}
  finally{alphaBtn.disabled=false}
};

function reverseAlphaUnblend(data,mask,w,h,alpha,overlayVal){
  for(let i=0;i<w*h;i++){
    if(!mask[i*4]||mask[i*4]<=128)continue;
    const j=i*4;
    for(let c=0;c<3;c++){
      const blended=data[j+c];
      const original=(blended-alpha*overlayVal)/(1-alpha);
      data[j+c]=clamp(Math.round(original));
    }
  }
}

/* ---------- 清除元数据并验证 ---------- */
stripBtn.onclick=async()=>{
  if(st.tainted)return setStatus(stripStatus,'Canvas 污染','err');
  stripBtn.disabled=true;
  try{
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob)throw new Error('toBlob 为空');
    st.processedFile=new File([blob],'cleaned_'+(st.file?.name.replace(/\.[^.]+$/,'')||'image')+'.png',{type:'image/png'});
    if(st.outUrl)URL.revokeObjectURL(st.outUrl);
    st.outUrl=URL.createObjectURL(blob);dlLink.href=st.outUrl;dlLink.download=st.processedFile.name;dlRow.hidden=false;
    setStatus(stripStatus,`已导出 ${(blob.size/1024).toFixed(0)}KB。点击验证。`,'ok');
    verifyBtn.disabled=false;
  }catch(e){setStatus(stripStatus,'导出失败：'+e.message,'err')}
  finally{stripBtn.disabled=false}
};

verifyBtn.onclick=async()=>{
  if(!st.processedFile)return;
  verifyBtn.disabled=true;setStatus(stripStatus,'重新解析导出文件…');
  try{
    const ER=await ensureExif();const tags=await ER.load(st.processedFile);
    st.verifyExif=extract(tags);render('verify');
    setStatus(stripStatus,'验证完成','ok');
  }catch(e){setStatus(stripStatus,'验证失败：'+e.message,'err')}
  finally{verifyBtn.disabled=false}
};

function render(mode){
  const orig=st.origExif||{},cur=mode==='verify'?(st.verifyExif||{}):null;
  const keys=new Set([...Object.keys(orig),...(cur?Object.keys(cur):[])]);
  if(keys.size===0){reportEl.innerHTML='<div style="color:#3fb950;font-size:12.5px;padding:8px 0">原图无常见敏感元数据。</div>';return}
  let html='';
  for(const k of keys){
    const o=orig[k],c=cur?cur[k]:undefined;const had=o!=null&&o!=='',has=c!=null&&c!=='';
    let badge,detail;
    if(mode==='orig'){badge=had?'<span class="badge b-present">存在</span>':'<span class="badge b-empty">空</span>';detail=had?esc(String(o)):'—'}
    else{
      if(had&&!has){badge='<span class="badge b-removed">已移除</span>';detail='<s style="color:var(--muted)">'+esc(String(o))+'</s> → 无'}
      else if(had&&has){badge='<span class="badge b-present">仍存在</span>';detail=esc(String(c))}
      else{badge='<span class="badge b-empty">空</span>';detail='—'}
    }
    html+=`<div class="report-item"><div class="report-key">${esc(k)}</div><div>${badge} ${detail}</div></div>`;
  }
  if(mode==='verify'){
    const still=Object.keys(cur||{}).filter(k=>cur[k]!=null&&cur[k]!=='');
    html=still.length===0
      ?'<div style="color:#3fb950;font-size:12.5px;padding:8px 0">✓ 导出文件未检测到原图敏感字段。</div>'+html
      :'<div style="color:#f85149;font-size:12.5px;padding:8px 0">⚠ 仍存在：'+still.map(esc).join('、')+'</div>'+html;
  }
  reportEl.innerHTML=html;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- 启动 ---------- */
ensureExif().catch(()=>{boot.textContent='EXIF 验证器不可用（修复功能仍可用）';boot.style.color='#d29922'});

})();
</script>
